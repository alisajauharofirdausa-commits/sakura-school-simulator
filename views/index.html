<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Sistem Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800">📦 Sistem Pengelolaan Inventory</h1>
        <div class="flex items-center gap-4">
            <span id="userInfo" class="text-sm text-slate-600 font-medium"></span>
            <button id="btnLogout" class="text-sm text-red-600 hover:text-red-800 font-semibold">Logout</button>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-6">

    <div id="alertContainer" class="mb-4"></div>

    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-6">
        <button id="btn-stok" onclick="switchTab('stok')"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow-sm">
            📋 Data Barang
        </button>
        <button id="btn-gudang" onclick="switchTab('gudang')"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50">
            🏬 Gudang
        </button>
        <button id="btn-vendor" onclick="switchTab('vendor')"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50">
            🚚 Vendor/Supplier
        </button>
    </div>

    <!-- TAB: STOK BARANG -->
    <div id="tab-stok" class="tab-content">
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="font-bold text-slate-800 mb-4">➕ Tambah Barang</h2>
            <form id="formBarang" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Serial Number</label>
                    <input type="text" id="serial_number" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Barang</label>
                    <input type="text" id="nama_barang" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Jenis Barang</label>
                    <input type="text" id="jenis" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Kuantitas Stok</label>
                    <input type="number" id="stok" min="0" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Harga</label>
                    <input type="number" id="harga" min="0" step="0.01" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Gudang</label>
                    <select id="id_gudang" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">-- Pilih Gudang --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Vendor</label>
                    <select id="id_vendor" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">-- Pilih Vendor --</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg text-sm">
                        Simpan Barang
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-slate-800">📋 Daftar Barang</h2>
                <input type="text" id="searchInput" placeholder="Cari barang..."
                    class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-64">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-slate-500 border-b">
                            <th class="p-3">Serial Number</th>
                            <th class="p-3">Nama Barang</th>
                            <th class="p-3">Stok</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3">Gudang</th>
                            <th class="p-3">Vendor</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelInventory"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB: GUDANG -->
    <div id="tab-gudang" class="tab-content hidden">
        <div class="bg-white rounded-2xl shadow-sm p-6">
            <h2 class="font-bold text-slate-800 mb-4">🏬 Tambah Gudang Cabang</h2>
            <form id="formGudang" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-lg">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Gudang</label>
                    <input type="text" id="nama_gudang" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Lokasi</label>
                    <input type="text" id="lokasi" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg text-sm">
                        Tambah Gudang
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TAB: VENDOR -->
    <div id="tab-vendor" class="tab-content hidden">
        <div class="bg-white rounded-2xl shadow-sm p-6">
            <h2 class="font-bold text-slate-800 mb-4">🚚 Tambah Vendor/Supplier</h2>
            <form id="formVendor" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-lg">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Vendor</label>
                    <input type="text" id="nama_vendor" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Kontak</label>
                    <input type="text" id="kontak_vendor" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg text-sm">
                        Tambah Vendor
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>

<script src="app.js"></script>
</body>
</html>
