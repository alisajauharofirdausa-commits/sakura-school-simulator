<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-md border border-slate-200">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Sistem Inventory</h1>
            <p class="text-sm text-slate-500 mt-1">Masukan akun untuk mengelola stok</p>
        </div>

        <!-- Pesan Error -->
        <div id="errorMessage" class="hidden p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>

        <form id="formLogin" class="space-y-4">
            <!-- Username -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" id="username" required class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan username">
            </div>

            <!-- Password dengan Tombol Mata -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full p-2.5 pr-10 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tombol Masuk ke Dashboard -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                Masuk ke Dashboard
            </button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
