<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistem Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">🔐 Login Admin</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Sistem Pengelolaan Inventory</p>

        <div id="errorBox" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"></div>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nomor ID</label>
                <input type="text" id="nomor_id" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
                Masuk
            </button>
        </form>
    </div>

<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('hidden');

    const payload = {
        nomor_id: document.getElementById('nomor_id').value,
        password: document.getElementById('password').value
    };

    try {
        const res = await fetch('../controllers/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
            window.location.href = 'index.html';
        } else {
            errorBox.textContent = data.message || 'Login gagal.';
            errorBox.classList.remove('hidden');
        }
    } catch (err) {
        errorBox.textContent = 'Terjadi kesalahan saat menghubungi server.';
        errorBox.classList.remove('hidden');
    }
});
</script>
</body>
</html>
